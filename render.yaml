services:
  - type: web
    name: youtube-video-agent-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TTS_VOICE
        value: en-US-AriaNeural
      - key: IMAGE_SOURCE
        value: duckduckgo
      - key: PEXELS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
